# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "develop"
    groups:
      # These package families must move together or NU1109 downgrade errors
      # break the build when only one member is bumped.
      duende:
        patterns:
          - "Duende.IdentityServer*"
      identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.Tokens.Jwt"
      # The OpenTelemetry packages share the core OpenTelemetry dependency; separate PRs conflict on it.
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      # One PR per .NET servicing release instead of one per package and project.
      # A new major version stays its own PR: it is a target framework decision.
      dotnet-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Bcl.*"
          - "System.Configuration.ConfigurationManager"
          - "System.Security.Cryptography.*"
          - "dotnet-ef"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Firely.Fhir.Packages >= 5.0 pulls Hl7.Fhir.Base 6.x, which removed
      # BaseFhirParser/CommonFhirJsonSerializer still used by Udap.Proxy.Server.
      # Pinned to 4.9.1 until the deferred Hl7.Fhir 6.x migration (see CLAUDE.md).
      - dependency-name: "Firely.Fhir.Packages"
        update-types: ["version-update:semver-major"]
      # Firely.Fhir.Validation.R4B 3.x belongs to the same Hl7.Fhir 6.x migration;
      # it stays on 2.7.1 alongside Firely.Fhir.Packages 4.9.1.
      - dependency-name: "Firely.Fhir.Validation.R4B"
        update-types: ["version-update:semver-major"]
  
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"

  # The workflows pin every action to a commit; this keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      actions:
        patterns:
          - "*"
