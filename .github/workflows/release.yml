# Publishes every Udap.* package to nuget.org from a version tag:
#   v1.2.3             release
#   v1.2.3-preview001  prerelease
# The packages are refused if any dependency has a known vulnerability or the public API breaks
# against the package validation baseline (Common.props). Each .nupkg carries its CycloneDX SBOM;
# the packages and SBOMs also get a build provenance attestation and are attached to a GitHub release.

name: Release to Nuget.org
run-name: "Release ${{ github.ref_name }} to nuget.org"

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9][0-9][0-9]"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    # Packages are published only from JoeShook/udap-dotnet. In any other copy of this repository,
    # such as udap-tools/udap-dotnet, a v* tag skips the job instead of attempting a release.
    if: github.repository == 'JoeShook/udap-dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release environment only deploys from v* tags and holds the nuget.org publishing secret.
    environment: release
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the provenance attestation
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Set VERSION from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
    - name: Restore
      run: |
        dotnet tool restore
        dotnet restore Udap.sln
    - name: Refuse vulnerable packages
      run: bash .github/scripts/check-vulnerable.sh
    - name: Pack
      run: bash .github/scripts/pack.sh "$VERSION" artifacts
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          artifacts/*.nupkg
          artifacts/*.snupkg
          artifacts/sbom/*.cdx.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages
        path: artifacts
    # Pushing a .nupkg also pushes the .snupkg beside it to the symbol server.
    - name: Push
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        for package in artifacts/*.nupkg; do
          dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        done
    - name: GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=()
        if [[ "$GITHUB_REF_NAME" == *-preview* ]]; then prerelease=(--prerelease); fi
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
          artifacts/*.nupkg artifacts/*.snupkg artifacts/sbom/*.cdx.json
